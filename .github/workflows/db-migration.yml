name: Database Migration

on:
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
  # 手动重跑
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 前置守卫：缺凭证直接红，不静默绿（2026-09-17 血训连环）：
      # ① supabase-action 不认 args；② 细粒度 token 缺 link 所需项目可见权限；
      # ③ CI 无固定出口 IP，5432 直连被 Network Restrictions 拒。
      # 故走 Management API（token 已授 Database SQL + Migrations 读写），不碰 pg 端口。
      - name: Guard secrets
        run: |
          test -n "${{ secrets.SUPABASE_PROJECT_ID }}" || { echo "::error::缺仓库 Secret SUPABASE_PROJECT_ID（Dashboard → Project Settings → General → Reference ID）"; exit 1; }
          test -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" || { echo "::error::缺仓库 Secret SUPABASE_ACCESS_TOKEN（Dashboard → Access Tokens，Database + Migrations 读写）"; exit 1; }

      # 真门：R4-1 定向直推 + 落库核验（版本表命中则跳过；文件自带幂等可重跑）。
      - name: Apply migrations
        run: node scripts/apply-migration-api.mjs supabase/migrations/20260917_review_dual_track.sql
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
