name: Database Migration

on:
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
  # 手动重跑（2026-09-17：lint 步因缺本地库自 09-06 起全红，改 push 直推为真门）
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 真门 = db push 本体（SQL 非法直红）；坏掉的本地 lint 已删，不设假门。
      - name: Apply migrations
        uses: supabase/supabase-action@v1
        with:
          args: db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
