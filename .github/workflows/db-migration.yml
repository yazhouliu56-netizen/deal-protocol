name: Database Migration

on:
  push:
    branches: [master]
    paths:
      - 'supabase/migrations/**'
  # 手动重跑：inputs.files 为空 = 跳过（全量对账须显式填 ALL，经版本表逐个跳过已应用）
  workflow_dispatch:
    inputs:
      files:
        description: '空格分隔的迁移文件（空 = 跳过，ALL = 全量对账）'
        required: false
        default: ''
      check:
        description: '落库核验 SQL（空 = 跳过）'
        required: false
        default: ''
      expect:
        description: '核验期望子串（空白归一后包含）'
        required: false
        default: ''

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 前置守卫：缺凭证直接红，不静默绿（2026-09-17 血训连环）：
      # ① supabase-action 不认 args；② 细粒度 token 缺 link 所需项目可见权限；
      # ③ CI 无固定出口 IP，5432 直连被 Network Restrictions 拒。
      # 故走 Management API（token 已授 Database SQL + Migrations 读写），不碰 pg 端口。
      - name: Guard secrets
        run: |
          test -n "${{ secrets.SUPABASE_PROJECT_ID }}" || { echo "::error::缺仓库 Secret SUPABASE_PROJECT_ID（Dashboard → Project Settings → General → Reference ID）"; exit 1; }
          test -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" || { echo "::error::缺仓库 Secret SUPABASE_ACCESS_TOKEN（Dashboard → Access Tokens，Database + Migrations 读写）"; exit 1; }

      # 真门：定向/全量直推 + 可选落库核验（版本表命中跳过；文件自带幂等可重跑）。
      - name: Apply migrations
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "${{ inputs.files }}" ]; then echo "未指定文件，跳过"; exit 0; fi
            if [ "${{ inputs.files }}" = "ALL" ]; then FILES=$(ls supabase/migrations/*.sql | sort | tr '\n' ' '); else FILES="${{ inputs.files }}"; fi
          else
            FILES=$(git diff --name-only ${{ github.event.before }} HEAD -- supabase/migrations/ | tr '\n' ' ')
          fi
          if [ -z "$FILES" ]; then echo "无迁移变更，跳过"; exit 0; fi
          ARGS="$FILES"
          if [ -n "${{ inputs.check }}" ]; then ARGS="$ARGS --check ${{ inputs.check }} --expect ${{ inputs.expect }}"; fi
          node scripts/apply-migration-api.mjs $ARGS
        env:
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
