name: CI & Smoke Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  deployment_status:

jobs:
  typecheck-and-build:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: TypeScript 全量类型检查
        run: npx tsc --noEmit
      - name: 生产构建冒烟
        run: npm run build

  unit-tests-and-lint:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: 全量单元测试（856 项：vitest 426 + node:test 430）
        run: npm test
      - name: ESLint
        run: npm run lint
      - name: 第一性原理物理门禁（硬编码提示词归零 + Base 纯核 0 Store 引用）
        run: npm run check:first-principle

  e2e-verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: chromium
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54321' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: 安装 Playwright Chromium
        run: npx playwright-core install --with-deps chromium
      - name: 全链 E2E 回归（build → start :3000 → 13 条 e2e-*.mjs）
        run: npm run test:verify

  vercel-smoke-test:
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Execute Smoke Test on Vercel Target URL
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: npm run test:smoke
